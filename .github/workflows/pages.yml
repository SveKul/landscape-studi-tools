name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keine Abhängigkeiten: der Generator nutzt ausschließlich die Standardbibliothek.
      - name: Übersicht bauen
        run: python src/build.py --out docs

      - name: Ausgabe prüfen
        run: |
          test -s docs/index.html
          test -s docs/studi-tools.svg
          test -s docs/studi-tools.pdf
          echo "Seitengröße: $(du -h docs/index.html | cut -f1)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
